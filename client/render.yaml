# Render Static Site for the client.
#   Blueprint: New → Blueprint, pick this repo, Blueprint Path client/render.yaml
#   Or by hand (New → Static Site) with the same values:
#     Root Directory     client
#     Build Command      npm ci && npm run build
#     Publish Directory  dist
#     Rewrite            /*  →  /index.html   (Redirects/Rewrites)
#     Env var            NODE_VERSION = 24
services:
  - type: web
    runtime: static
    name: vanguard-luminaries-foundation
    branch: main
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # Every path serves the app; React Router handles routing in the browser.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
